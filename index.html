<header class="top"><div class="brand"><span class="logo" aria-hidden="true">⌂</span>Mi Casa</div><nav class="nav" aria-label="Vistas"><button id="homeTab" type="button">Vista general</button><button id="cameraTab" type="button">Cámaras</button></nav><span class="demo">Maqueta interactiva</span></header>
<main><section id="home" aria-label="Vista general"><div class="hero scene photo-0"><h1>Vista general</h1><p id="summary" aria-live="polite"></p><button class="action primary" id="cameraLink" type="button">Ver las 2 cámaras</button></div>
<section class="section"><div class="between"><h2>Ambientes</h2><div class="filter" aria-label="Filtrar ambientes"><button class="pill" data-filter="Todos">Todos</button><button class="pill" data-filter="Interior">Interior</button><button class="pill" data-filter="Exterior">Exterior</button></div></div><div class="grid" id="rooms"></div></section>
<section class="section"><div class="between"><h2>Accesos y equipos</h2></div><div class="controls" id="devices"></div></section></section>
<section id="cameras" hidden><h1>Cámaras</h1><p class="helper">Canales 1 y 3 del NVR en una sola vista. Imágenes de ejemplo.</p><div class="feeds" id="feeds"></div></section></main><footer class="foot">Controles simulados · Maqueta de Mi Casa</footer></div>
<dialog id="details"><div class="between"><h2 id="detailName"></h2><form method="dialog"><button class="close" aria-label="Cerrar">✕</button></form></div><p class="helper" id="detailStatus"></p><div class="dialog-actions" id="detailActions"></div></dialog>
<script>
const spaces = [
 ['Living','Interior',1,true],['Comedor','Interior',2,false],['Cocina','Interior',3,true],
 ['Dormitorio 1','Interior',4,false],['Dormitorio 2','Interior',4,false],['Dormitorio 3','Interior',4,false],
 ['Baño 1','Interior',5,false],['Baño 2','Interior',5,false],['Pasillo interior','Interior',6,false],
 ['Patio delantero','Exterior',0,false],['Patio costado','Exterior',8,false],['Terraza','Exterior',7,false],
 ['Patio trasero','Exterior',7,false]
].map(([name,group,photo,on]) => ({name,group,photo,on}));
const equipment = ['Puerta eléctrica','Portón eléctrico para auto','Aire acondicionado','TV'];
const get = id => document.getElementById(id);
const filterButtons = [...document.querySelectorAll('[data-filter]')];
let filter = 'Todos';

function photoClass(photo) {
  return 'photo-' + photo;
}

function roomStatus(room) {
  return room.on ? 'Luz encendida' : 'Luz apagada';
}

function renderRooms() {
  const lit = spaces.filter(room => room.on).length;
  get('summary').textContent = lit === 1 ? '1 ambiente iluminado' : lit + ' ambientes iluminados';
  filterButtons.forEach(button => button.setAttribute('aria-pressed', button.dataset.filter === filter));
  get('rooms').innerHTML = spaces.map((room, i) => {
    if (filter !== 'Todos' && room.group !== filter) return '';
    return '<article class="room"><button class="poster scene ' + photoClass(room.photo) + '" data-info="' + i + '">' + room.name + '</button><div class="room-foot"><span>' + roomStatus(room) + '</span><button class="power" data-power="' + i + '" aria-label="Luz de ' + room.name + '" aria-pressed="' + room.on + '">⏻</button></div></article>';
  }).join('');
}

function selectView() {
  const showCameras = location.hash === '#camaras';
  get('home').hidden = showCameras;
  get('cameras').hidden = !showCameras;
  get('homeTab').setAttribute('aria-current', showCameras ? 'false' : 'page');
  get('cameraTab').setAttribute('aria-current', showCameras ? 'page' : 'false');
}
function showDialog(name, status, action) {
  get('detailName').textContent = name;
  get('detailStatus').textContent = status;
  get('detailActions').replaceChildren();
  if (action) get('detailActions').append(action);
  get('details').showModal();
}
function toggleRoom(index) {
  spaces[index].on = !spaces[index].on;
  renderRooms();
}
function showRoom(index) {
  const room = spaces[index];
  const action = document.createElement('button');
  action.className = 'action primary';
  const update = () => {
    action.textContent = room.on ? 'Apagar luz' : 'Encender luz';
    get('detailStatus').textContent = roomStatus(room) + ' · Simulación';
  };
  action.onclick = () => { toggleRoom(index); update(); };
  showDialog(room.name, '', action);
  update();
}

get('rooms').addEventListener('click', event => {
  const power = event.target.closest('[data-power]');
  const info = event.target.closest('[data-info]');
  if (power) {
    toggleRoom(Number(power.dataset.power));
    get('rooms').querySelector('[data-power="' + power.dataset.power + '"]').focus();
  }
  if (info) showRoom(Number(info.dataset.info));
});
filterButtons.forEach(button => button.onclick = () => { filter = button.dataset.filter; renderRooms(); });
equipment.forEach(name => {
  const button = document.createElement('button');
  button.className = 'control';
  button.textContent = name;
  const status = document.createElement('small');
  status.textContent = 'Pendiente de integrar';
  button.append(status);
  button.onclick = () => showDialog(name, 'Espacio reservado para conectar el equipo en Home Assistant.');
  get('devices').append(button);
});
get('feeds').innerHTML = [[1,8],[3,7]].map(([channel, photo]) =>
  '<article class="feed"><div class="frame scene ' + photoClass(photo) + '"><span>Vista de ejemplo</span></div><div class="between"><h2>Canal ' + channel + '</h2></div></article>'
).join('');
get('homeTab').onclick = () => { location.hash = 'inicio'; };
get('cameraTab').onclick = get('cameraLink').onclick = () => { location.hash = 'camaras'; };
window.addEventListener('hashchange', () => { selectView(); window.scrollTo(0, 0); });
renderRooms();
selectView();
</script></body></html>
