<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c1210">
<title>Mi Oficina</title>
<style>
:root{color-scheme:dark;--bg:#0c1210;--card:#151e19;--line:#2b3a31;--text:#f3f7f1;--muted:#afc1b3;--mint:#c5f3ac}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,sans-serif}
main{width:min(100%,960px);margin:auto;padding:20px clamp(12px,4vw,34px) 36px}
h1,h2,p{margin:0}h1{font-size:1.65rem;letter-spacing:-.04em}h2{font-size:1.15rem}p,small{color:var(--muted)}small{font-size:.85rem}
header,.head,.device{display:flex;justify-content:space-between;align-items:center;gap:12px}
.tag{border:1px solid var(--line);border-radius:20px;color:var(--mint);padding:5px 10px;white-space:nowrap;font-size:.78rem}
nav{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:5px;margin:16px 0}
button,input{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
nav button{border:0;border-radius:11px;background:transparent;min-height:44px;font-weight:650}nav button[aria-current=page]{background:var(--mint);color:#182312}
.card{border:1px solid var(--line);border-radius:18px;background:var(--card);padding:13px;margin-bottom:12px}
.head{margin-bottom:10px;flex-wrap:wrap}.head p{font-size:.875rem}
.map{position:relative;isolation:isolate;max-width:760px;margin:auto;overflow:hidden;border-radius:12px;background:#222a24}
.map img{width:100%;height:auto;display:block;filter:brightness(.65) saturate(.8)}
.pin{position:absolute;top:var(--y);left:var(--x);transform:translate(-50%,-50%);display:grid;place-items:center;width:44px;height:44px;padding:0;background:transparent;border:0;border-radius:50%;z-index:1}
.pin span{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#162019;color:#fff;border:1px solid #d6e5d6;box-shadow:0 2px 5px #000b;font-size:.76rem;font-weight:750;pointer-events:none}
.pin[aria-pressed=true]{z-index:2}.pin[aria-pressed=true] span{background:var(--mint);border-color:var(--mint);color:#131e13;box-shadow:0 0 0 4px #192819aa}
.areas{display:flex;gap:6px;overflow:auto;padding:3px 2px 5px;margin-top:9px;scrollbar-width:thin}
.chip,.control{border:1px solid var(--line);border-radius:12px;background:#202d24;padding:8px 11px;min-height:44px;text-decoration:none;color:var(--text)}
.chip{flex:none;font-size:.82rem}.chip[aria-pressed=true],.control[aria-pressed=true]{background:var(--mint);color:#142112;border-color:var(--mint)}
.switches{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:12px}
.switches .control{min-height:57px;text-align:left}.switches .control strong,.switches .control span{display:block}.control span{font-size:.84rem}
.device{padding:10px 0;border-top:1px solid var(--line)}.device:first-of-type{margin-top:9px}.device small{display:block}
.camera-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
label{display:block;margin-top:10px;color:var(--muted);font-size:.88rem} input{width:100%;margin:4px 0 8px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--text)}
.camera-actions{display:flex;gap:8px;flex-wrap:wrap}.camera-actions a{display:inline-grid;place-items:center}.msg{display:block;margin-top:6px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}[hidden]{display:none!important}
@media(max-width:400px){.pin span{width:23px;height:23px}.pin{width:39px;height:44px}.card{padding:10px}}
.plan-hint{display:flex;align-items:center;gap:6px}
.activity-dot,.pin[data-active] span::after,.chip[data-active]::after{
 background:var(--mint);border:1px solid #162019;border-radius:50%;width:9px;height:9px;display:inline-block
}
.pin[data-active] span::after{content:"";position:absolute;top:4px;right:4px;box-shadow:0 0 0 1px #162019}
.chip[data-active]::after{content:"";margin-left:6px}
body:has(#zone-sheet[open]){overflow:hidden}
#zone-sheet{
 position:fixed;inset:auto 0 0;margin:0 auto;width:min(100%,580px);max-width:none;
 max-height:85vh;max-height:85dvh;overflow:auto;overscroll-behavior:contain;padding:0;
 color:var(--text);background:var(--card);border:1px solid var(--line);
 border-radius:22px 22px 0 0;box-shadow:0 -12px 48px #0007
}
#zone-sheet::backdrop{background:#060a08aa}
.sheet-content{padding:16px clamp(14px,4vw,24px) max(20px,env(safe-area-inset-bottom))}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet-head h2{font-size:1.3rem}.sheet-status{margin-top:4px}
@media(prefers-reduced-motion:no-preference){
 #zone-sheet[open]{animation:sheet-in 180ms ease-out}
 @keyframes sheet-in{from{transform:translateY(24px);opacity:.5}to{transform:none;opacity:1}}
}
</style>
</head>

<script>
const zones=[
 ['Entrada',230,442,['luz']],
 ['Bodega',267,574,['luz']],
 ['Sala interactiva',337,284,['luz','energia']],
 ['Mesa de ayuda',520,242,['luz','energia','aire']],
 ['Sala individual',599,373,['luz','energia','aire']],
 ['Cocina',494,401,['luz']],
 ['Baño 1',477,479,['luz']],
 ['Baño 2',401,462,['luz']],
 ['Oficina 1',764,246,['luz','energia','aire']],
 ['Oficina 2',685,112,['luz','energia','aire']]
];
const names={luz:'Luces',energia:'Energía',aire:'Aire acondicionado'};
const state=new Map(), controls=new Map();
const get=id=>document.getElementById(id);
const make=(tag,cls,label)=>{const el=document.createElement(tag);if(cls)el.className=cls;if(label)el.textContent=label;return el};
const announce=message=>{get('announcement').textContent=message};
const sheet=get('zone-sheet');
const selectors=[];
let selected=null;
function status(kind,on){return kind==='energia'?(on?'Activada':'Desactivada'):(on?(kind==='luz'?'Encendidas':'Encendido'):(kind==='luz'?'Apagadas':'Apagado'))}
function update(key){const on=state.get(key);for(const {button,label,kind} of controls.get(key)){button.setAttribute('aria-pressed',String(on));label.textContent=status(kind,on)}}
function buttonFor(i,kind,compact){
 const key=i+':'+kind, button=make('button','control'),label=make('span');button.type='button';button.setAttribute('aria-label',names[kind]+' en '+zones[i][0]);
 if(!compact)button.append(make('strong','',names[kind]));
 button.append(label);
 if(!controls.has(key)){controls.set(key,new Set());state.set(key,false)}
 const entry={button,label,kind};controls.get(key).add(entry);update(key);
 button.onclick=()=>{
  state.set(key,!state.get(key));
  update(key);
  updateSector(i);
  announce(zones[i][0]+' · '+names[kind]+' · '+status(kind,state.get(key))+' (demo)');
 };
 return {button,remove:()=>controls.get(key).delete(entry)};
}
let current=[];
function updateSector(i){
 const [name,,,kinds]=zones[i];
 const active=kinds.filter(kind=>state.get(i+':'+kind)).length;
 const detail=active===1?'1 equipo activo':active+' equipos activos';
 for(const button of selectors[i]){
  button.toggleAttribute('data-active',active>0);
  button.setAttribute('aria-label',name+' · '+detail);
 }
 if(selected===i)get('zone-status').textContent='Demo · '+detail;
}
function openSector(i){
 selected=i;
 selectors.forEach((group,j)=>group.forEach(button=>button.setAttribute('aria-pressed',String(j===i))));
 get('zone-title').textContent=zones[i][0];
 current.forEach(item=>item.remove());
 current=zones[i][3].map(kind=>buttonFor(i,kind,false));
 get('zone-controls').replaceChildren(...current.map(item=>item.button));
 updateSector(i);
 if(!sheet.open)sheet.showModal();
}
sheet.addEventListener('click',event=>{
 if(event.target===sheet)sheet.close();
});
sheet.addEventListener('close',()=>{
 selectors[selected]?.forEach(button=>button.setAttribute('aria-pressed','false'));
 selected=null;
 current.forEach(item=>item.remove());
 current=[];
 get('zone-controls').replaceChildren();
});
zones.forEach(([name,x,y,kinds],i)=>{
 const pin=make('button','pin'),chip=make('button','chip',name);pin.type=chip.type='button';pin.setAttribute('aria-label',name);pin.title=name;
 pin.style.setProperty('--x',100*x/934+'%');pin.style.setProperty('--y',100*y/701+'%');
 const number=make('span','',String(i+1));number.setAttribute('aria-hidden','true');pin.append(number);
 for(const button of [pin,chip]){
  button.setAttribute('aria-haspopup','dialog');
  button.setAttribute('aria-controls','zone-sheet');
  button.onclick=()=>openSector(i);
 }
 get('map').append(pin);get('areas').append(chip);selectors.push([pin,chip]);
 const group=make('section','card');group.append(make('h2','',name));
 kinds.forEach(kind=>{const row=make('div','device');row.append(make('strong','',names[kind]),buttonFor(i,kind,true).button);group.append(row)});get('equipment-list').append(group);
});
zones.forEach((_,i)=>updateSector(i));
const tabs=[...document.querySelectorAll('[data-tab]')];
function showTab(){const id=location.hash.slice(1);const chosen=tabs.some(tab=>tab.dataset.tab===id)?id:'plano';tabs.forEach(tab=>{const active=tab.dataset.tab===chosen;get(tab.dataset.tab).hidden=!active;tab.setAttribute('aria-current',active?'page':'false')})}
tabs.forEach(tab=>tab.onclick=()=>{location.hash=tab.dataset.tab});
window.addEventListener('hashchange',showTab);showTab();
let cameraLinks=[];
try{const stored=JSON.parse(localStorage.getItem('mi-oficina.camera-links.v1'));if(Array.isArray(stored))cameraLinks=stored}catch{}
function safeUrl(value){try{const u=new URL(value);if(['https:','http:'].includes(u.protocol)&&!u.username&&!u.password)return u.href}catch{}return ''}
['Entrada','Oficina técnica'].forEach((name,i)=>{
